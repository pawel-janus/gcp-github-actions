name: Deploy to GCP

on:
  push:
    branches:
      - main

jobs:
  detect-changes:
    name: Detect changed workspaces
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy-all: ${{ steps.filter.outputs.deploy-all }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'workspaces/backend/**'
            frontend:
              - 'workspaces/frontend/**'
            deploy-all:
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'

  deploy-backend:
    name: Deploy Backend
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.deploy-all == 'true'
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service-name: backend
      service-type: cloud-run
      workspace: workspaces/backend

  deploy-frontend:
    name: Deploy Frontend
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.deploy-all == 'true'
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service-name: frontend
      service-type: firebase-hosting
      workspace: workspaces/frontend
