name: Deploy to GCP

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/216135873902/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-sa@native-dev-506112.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Docker image
        run: |
          gcloud builds submit \
            --project=native-dev-506112 \
            --config=workspaces/backend/cloudbuild.yaml \
            .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy backend \
            --project=native-dev-506112 \
            --image=europe-central2-docker.pkg.dev/native-dev-506112/gcp-apps/backend:latest \
            --platform=managed \
            --region=europe-central2 \
            --allow-unauthenticated \
            --port=3000 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10

      - name: Get Service URL
        run: |
          gcloud run services describe backend \
            --project=native-dev-506112 \
            --region=europe-central2 \
            --format='value(status.url)'
