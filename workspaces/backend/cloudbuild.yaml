steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'workspaces/backend/Dockerfile'
      - '-t'
      - 'europe-central2-docker.pkg.dev/$PROJECT_ID/gcp-apps/backend:latest'
      - '.'

images:
  - 'europe-central2-docker.pkg.dev/$PROJECT_ID/gcp-apps/backend:latest'
